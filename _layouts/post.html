<nav class="navbar">

  <div class="navbar-right">
    <a href="https://github.com/aabiji" aria-label="GitHub">
      <i class="fa-brands fa-github"></i>

    <a href="https://x.com/TripleAAABaddie" aria-label="X">
      <i class="fa-brands fa-x-twitter"></i>
    </a>

<article class="post">

    <h1>{{ page.title }}</h1>

  </header>
  <div class="post-content">{{ content }}</div>
</article>
